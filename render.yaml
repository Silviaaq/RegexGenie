services:
  - type: web
    name: RegexGenie
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DATABASE_PATH
        value: /tmp/regexgenie.sqlite3
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: WORKSPACE_DIR
        value: /tmp/regexgenie-workspaces
