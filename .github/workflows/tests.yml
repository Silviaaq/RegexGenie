name: Validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r backend/requirements.txt
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run build
      - run: python backend/manage.py test core --noinput
        env:
          DJANGO_SECRET_KEY: ci-test-only-not-a-production-secret
      - run: docker build -t regexgenie:test .
